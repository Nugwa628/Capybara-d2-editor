[workspace]
resolver = "3"
members = [
    "crates/d2-formats",
    "crates/d2-assets",
    "crates/capy-index",
    "crates/capy-edit",
    "crates/capy-history",
    "crates/capy-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"
repository = ""
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
panic = "warn"

[workspace.dependencies]
d2-formats = { path = "crates/d2-formats" }
d2-assets = { path = "crates/d2-assets" }
capy-index = { path = "crates/capy-index" }
capy-edit = { path = "crates/capy-edit" }
capy-history = { path = "crates/capy-history" }
thiserror = "2"
anyhow = "1"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
