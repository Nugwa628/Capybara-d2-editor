[workspace]
resolver = "3"
members = [
    "crates/d2-formats",
    "crates/d2-assets",
    "crates/capy-index",
    "crates/capy-edit",
    "crates/capy-history",
    "crates/capy-render",
    "crates/capy-sprite",
    "crates/capy-cli",
    "crates/capy-app",
    "crates/capy-paint",
]

[workspace.package]
version = "1.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"
repository = ""
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
panic = "warn"

[workspace.dependencies]
d2-formats = { path = "crates/d2-formats" }
d2-assets = { path = "crates/d2-assets" }
capy-index = { path = "crates/capy-index" }
capy-edit = { path = "crates/capy-edit" }
capy-history = { path = "crates/capy-history" }
capy-render = { path = "crates/capy-render" }
capy-sprite = { path = "crates/capy-sprite" }
capy-cli = { path = "crates/capy-cli" }
capy-paint = { path = "crates/capy-paint" }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
bzip2 = "0.6"
explode = "0.1"
tempfile = "3"
proptest = "1"
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
nucleo = "0.5"
image_hasher = "3.1"
image = { version = "0.25", default-features = false, features = ["png", "bmp", "gif"] }
blake3 = { version = "1", default-features = false, features = ["pure"] }
gix = { version = "0.89", default-features = false, features = ["sha1"] }
png = "0.18"
arboard = { version = "3", default-features = false }
gif = "0.14"
# Native file dialogs (capy-app only).
rfd = "0.17"
# Console attach for the single-exe CLI on Windows (capy-app only).
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }
# Read-only lookup of the Diablo II install path (d2-assets and capy-app, Windows).
windows-registry = "0.6"
# Local time for the History panel and the autosave note (capy-app only).
jiff = "0.2"
# The window/taskbar icon (capy-app only); the version Bevy's winit backend uses.
winit = { version = "0.30", default-features = false }
# Exe icon and version resource from capy-app's build script (Windows hosts
# only; MIT, 2026-03-16). Needs rc.exe from the Windows SDK.
winresource = { version = "=0.1.31", default-features = false }

# UI stack, pinned together: bevy_egui 0.43.1 and egui_dock 0.21.1 both
# require egui 0.36.2. `cargo tree -d` showed a single egui with this set.
# Only capy-app may use these.
bevy = { version = "=0.20.0", default-features = false }
bevy_egui = { version = "=0.43.1", default-features = false, features = ["render", "default_fonts", "manage_clipboard", "open_url"] }
egui_dock = "=0.21.1"
egui = "=0.36.2"

[profile.dev.package."*"]
opt-level = 2

# The corpus tests decode gigabytes of game data; keep them fast in dev.
[profile.dev.package.d2-formats]
opt-level = 2

[profile.dev.package.d2-assets]
opt-level = 2

# Pixel analysis, hashing and PNG encoding over tens of thousands of tiles.
[profile.dev.package.capy-index]
opt-level = 2

[profile.dev.package.capy-render]
opt-level = 2

# Quantizing and re-encoding sprites in the corpus tests.
[profile.dev.package.capy-sprite]
opt-level = 2

# Gradient, dithering and proptest sequences over many small frames.
[profile.dev.package.capy-paint]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
