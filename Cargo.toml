[workspace]
resolver = "3"
members = [
    "crates/d2-formats",
    "crates/d2-assets",
    "crates/capy-index",
    "crates/capy-edit",
    "crates/capy-history",
    "crates/capy-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"
repository = ""
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "warn"
panic = "warn"

[workspace.dependencies]
d2-formats = { path = "crates/d2-formats" }
d2-assets = { path = "crates/d2-assets" }
capy-index = { path = "crates/capy-index" }
capy-edit = { path = "crates/capy-edit" }
capy-history = { path = "crates/capy-history" }
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
proptest = "1"

# UI stack, pinned together: bevy_egui 0.43.1 and egui_dock 0.21.1 both
# require egui 0.36.2. `cargo tree -d` showed a single egui with this set.
# Only capy-app may use these.
bevy = { version = "=0.20.0", default-features = false }
bevy_egui = "=0.43.1"
egui_dock = "=0.21.1"
egui = "=0.36.2"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
