[package]
name = "capy-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "CapybaraMapEditor"
path = "src/main.rs"

[features]
# Dev-only: `cargo run -p capy-app -F dev`. Never enabled for release builds.
dev = ["bevy/dynamic_linking"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
d2-formats.workspace = true
d2-assets.workspace = true
capy-render.workspace = true
capy-index.workspace = true
capy-edit.workspace = true
capy-history.workspace = true
capy-sprite.workspace = true
capy-paint.workspace = true
capy-cli.workspace = true
rfd.workspace = true
arboard = { workspace = true, features = ["image-data"] }
bevy = { workspace = true, features = [
    "std",
    "bevy_winit",
    "bevy_window",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_mesh",
    "bevy_asset",
    "bevy_log",
    "png",
    "multi_threaded",
] }
bevy_egui.workspace = true
egui_dock = { workspace = true, features = ["serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
